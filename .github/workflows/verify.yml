name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: install
        run: |
          npm ci || npm install
          npm --prefix static/panel ci || npm --prefix static/panel install

      - name: root typecheck
        run: npx tsc --noEmit

      - name: panel typecheck
        run: npm --prefix static/panel exec tsc -- --noEmit

      - name: tests
        run: npx vitest run

      - name: panel bundles
        run: |
          npm --prefix static/panel run build
          npm --prefix static/panel run build:web
