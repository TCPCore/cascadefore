name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: install
        run: |
          npm ci || npm install
          npm --prefix static/panel ci || npm --prefix static/panel install

      - name: root typecheck
        run: npx tsc --noEmit

      - name: panel typecheck
        run: npm --prefix static/panel exec tsc -- --noEmit

      - name: tests
        run: npx vitest run

      - name: panel bundles
        run: |
          npm --prefix static/panel run build
          npm --prefix static/panel run build:web

      - name: install browser
        run: npx playwright install --with-deps chromium

      - name: smoke + accessibility
        run: |
          CASCADE_SOURCE=live CASCADE_STORE=sqlite CASCADE_DB=/tmp/ci.db PORT=4199 npx tsx scripts/serve.ts &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4199/api/health >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:4199 node scripts/smoke.mjs
          BASE=http://127.0.0.1:4199 node scripts/a11y.mjs
