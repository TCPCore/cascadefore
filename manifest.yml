app:
  id: ari:cloud:ecosystem::app/1fcb1899-1194-47c1-a794-26e4d3e59e0f
  runtime:
    name: nodejs22.x
    memoryMB: 1024
  # Cross-context app: one installation covers both products, so a Rovo agent
  # installed in Jira can also reach Confluence content. Without this, an
  # app-based agent only sees its own installation's workspace.
  compatibility:
    # Exactly one context may be required; the other is reachable but optional.
    jira:
      required: true
    confluence:
      required: false

modules:
  # App-scoped HTTP surface: a plain URL that runs inside the Atlassian runtime
  # with no user session and no navigation. Used so the product can be tested by
  # opening a link, rather than by hunting for a module inside the 2026 Jira UI.
  webtrigger:
    - key: cascade-webhook
      function: webhook

  jira:issuePanel:
    - key: cascade-panel
      resource: main
      resolver:
        function: resolver
      title: Cascade
      icon: resource:main;icon.svg

  # Renders automatically in the issue's right-hand column, so the panel is
  # visible without hunting through a menu. This is the primary surface.
  # Renders on a dashboard without the user opening an Apps panel, which is the
  # only Jira surface that is discoverable by default in the 2026 work-item view.
  # Top-navigation surface: appears under Apps in the Jira header, not hidden
  # behind a work item's sidebar. This is the discoverable entry point.
  jira:globalPage:
    - key: cascade-global
      resource: main
      resolver:
        function: resolver
      title: Cascade

  # Admin surface: Jira Settings → Apps → Cascade. Guaranteed to be findable.
  jira:adminPage:
    - key: cascade-admin
      resource: main
      resolver:
        function: resolver
      title: Cascade

  jira:dashboardGadget:
    - key: cascade-decision-health
      resource: main
      resolver:
        function: resolver
      title: Decision health
      description: Decisions that still hold, decisions that broke, and decisions nobody can check.
      thumbnail: resource:main;icon.svg

  # Renders on every Confluence page it is scoped to, with no manual add step.
  confluence:contentBylineItem:
    - key: cascade-decision-byline
      resource: main
      resolver:
        function: resolver
      title: Cascade decisions
      description: Decision records linked to this page

  jira:issueContext:
    - key: cascade-context
      resource: main
      resolver:
        function: resolver
      title: Cascade
      label: Cascade

  function:
    - key: webhook
      handler: webhook.handler

    - key: resolver
      handler: resolvers/index.handler
    - key: reconstruct
      handler: jobs/reconstruct.reconstructHandler
    - key: run-cascade
      handler: actions/runCascade.runCascadeAction
    - key: project-tree-fn
      handler: actions/projectTree.projectTreeAction

    - key: find-precedent-fn
      handler: actions/findPrecedent.findPrecedentAction

    - key: decision-matrix-fn
      handler: actions/decisionMatrix.decisionMatrixAction

    - key: search-decisions-fn
      handler: actions/searchDecisions.searchDecisionsAction

    - key: why-fn
      handler: actions/searchDecisions.whyIsThisLikeThisAction

    - key: get-run-fn
      handler: actions/getRun.getRunAction
    - key: health-fn
      handler: actions/health.healthAction

  consumer:
    - key: cascade-jobs
      queue: cascade-jobs
      function: reconstruct

  action:
    - key: reconstruct-decision
      name: Reconstruct decision cascade
      function: run-cascade
      actionVerb: GET
      description: |
        Reconstruct the evidenced decision paths behind a work item failure.
        Returns the branches that were available at each decision point, scored
        by what was knowable at the time versus what proved viable since.
      inputs:
        workItemKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item key, for example BILL-142
        intent:
          title: Goal
          type: string
          required: false
          description: What the team is trying to achieve now
        horizon:
          title: Horizon
          type: string
          required: false
          description: One of weeks, quarters or years

    - key: project-tree
      name: Project decision tree
      function: project-tree-fn
      actionVerb: GET
      description: |
        Project the decision tree from a stored run, anchored at a chosen date and
        direction. Returns the decisions in force at that moment, the alternatives
        that were visible then, and the ones that were not yet knowable.
      inputs:
        runId:
          title: Run id
          type: string
          required: true
          description: The runId returned by reconstruct-decision
        asOf:
          title: As of
          type: string
          required: false
          description: ISO timestamp anchoring the projection. Defaults to the failure moment.
        direction:
          title: Direction
          type: string
          required: false
          description: backward (how we got here) or forward (what this still binds)
        depth:
          title: Depth
          type: string
          required: false
          description: Maximum number of decisions to project

    - key: search-decisions
      name: Search decisions
      function: search-decisions-fn
      actionVerb: GET
      description: |
        Find decisions by text, area or status. Use first when the question is
        broad ("why does the billing service use Postgres"). Every hit explains
        why it matched.
      inputs:
        text:
          title: Text
          type: string
          required: false
          description: Words to match, for example Postgres, mongodb, billing
        area:
          title: Area
          type: string
          required: false
          description: Domain filter, for example datastore
        status:
          title: Status
          type: string
          required: false
          description: enforced, violated, orphaned or unknown
        limit:
          title: Limit
          type: string
          required: false
          description: Maximum hits, default 10, cap 25

    - key: why-is-this-like-this
      name: Why is this like this
      function: why-fn
      actionVerb: GET
      description: |
        Answer "why is this like this?" for a technology, constraint, issue key or
        page id by returning the decisions that shaped it and their rationale.
        Admits plainly when the index cannot explain the subject.
      inputs:
        subject:
          title: Subject
          type: string
          required: true
          description: What to explain, for example Postgres, #no-downtime, ARCH-123

    - key: decision-matrix
      name: Decision matrix
      function: decision-matrix-fn
      actionVerb: GET
      description: |
        Aggregate the decision index by area or status: how many decisions hold,
        how many broke, and how many nobody can check. This is the all-areas view.
      inputs:
        groupBy:
          title: Group by
          type: string
          required: false
          description: area (default) or status

    - key: find-precedent
      name: Find precedent
      function: find-precedent-fn
      actionVerb: GET
      description: |
        Find what happened when other decisions took an alternative that was
        rejected here, split by what was knowable at the original decision time.
        Use before offering any judgement about a path not taken.
      inputs:
        alternativeText:
          title: Alternative
          type: string
          required: true
          description: The option that was considered, for example MongoDB
        asOf:
          title: Decision time
          type: string
          required: false
          description: ISO timestamp of the original decision. Precedent after this is labelled as not knowable then.
        area:
          title: Area
          type: string
          required: false
          description: Optional domain filter, for example datastore

    - key: get-run
      name: Get reconstruction run
      function: get-run-fn
      actionVerb: GET
      description: |
        Fetch a persisted reconstruction by run id, including decisions, branches
        and the recommendation.
      inputs:
        runId:
          title: Run id
          type: string
          required: true
          description: The runId returned by reconstruct-decision

    - key: health
      name: Cascade health
      function: health-fn
      actionVerb: GET
      description: |
        Report whether the app is configured for the real Teamwork Graph or
        running on the seeded demo graph.
      inputs: {}

  # Jira Automation action: a rule can invoke the reconstruction without anyone
  # opening the app. This is the "assign the work to Cascade" path.
  automation:actionProvider:
    - key: cascade-automation
      actions:
        - search-decisions
        - why-is-this-like-this
        - reconstruct-decision
        - project-tree
        - find-precedent
        - decision-matrix
        - get-run

  rovo:agent:
    - key: cascade-agent
      name: Cascade
      description: Reconstructs the decision paths that led to a failure and scores
        the alternatives
      icon: resource:main;icon.svg
      prompt: resource:agent;prompt.txt
      skills:
        - decision-autopsy
      actions:
        - search-decisions
        - why-is-this-like-this
        - reconstruct-decision
        - project-tree
        - find-precedent
        - decision-matrix
      conversationStarters:
        - Why does the billing service use Postgres?
        - Which decisions no longer hold, and in which areas?
        - What did we know when we chose this?
        - Show me the paths we did not take

  rovo:skill:
    - key: decision-autopsy
      source:
        dir: skills/decision-autopsy
      dependencies:
        tools:
          - search-decisions
          - why-is-this-like-this
          - reconstruct-decision
          - project-tree
          - find-precedent
          - decision-matrix

  rovo:mcp:
    - key: cascade-mcp
      name: Cascade
      tools:
        - search-decisions
        - why-is-this-like-this
        - reconstruct-decision
        - get-run
        - project-tree
        - find-precedent
        - decision-matrix
        - health

  sql:
    - key: cascade-db
      engine: mysql

resources:
  - key: main
    path: static/panel/build
  - key: agent
    path: resource/agent

permissions:
  scopes:
    - read:graph:issue:jira
    - read:graph:issue-comment:jira
    - read:graph:issue-status:jira
    - read:graph:issue-remote-link:jira
    - read:graph:project:jira
    - read:graph:page:confluence
    - read:graph:comment:confluence
    - read:graph:space:confluence
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - read:graph:goal:atlassian
    - read:graph:component:compass
    - read:graph:build:external
    - read:graph:deployment:external
    - read:graph:pull-request:external
    - read:confluence-content.all
    - write:confluence-content
    - write:jira-work
