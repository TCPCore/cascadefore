app:
  # Replace with the id printed by `forge create`. Keeping the placeholder here
  # makes the omission obvious rather than silent.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x
    memoryMB: 1024

modules:
  jira:issuePanel:
    - key: cascade-panel
      resource: main
      resolver:
        function: resolver
      title: Cascade
      icon: resource:main;icon.svg

  function:
    - key: resolver
      handler: src/resolvers/index.handler
    - key: reconstruct
      handler: src/jobs/reconstruct.reconstructHandler
    - key: run-cascade
      handler: src/actions/runCascade.runCascadeAction
    - key: register-queries
      handler: src/graph/registerQueries.registerQueriesHandler

  consumer:
    - key: cascade-jobs
      queue: cascade-jobs
      function: reconstruct

  action:
    - key: reconstruct-decision
      name: Reconstruct decision cascade
      function: run-cascade
      actionVerb: GET
      description: |
        Reconstruct the evidenced decision paths behind a work item failure.
        Returns the branches that were available at each decision point, scored
        by what was knowable at the time versus what proved viable since.
      inputs:
        workItemKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item key, for example BILL-142
        intent:
          title: Goal
          type: string
          required: false
          description: What the team is trying to achieve now
        horizon:
          title: Horizon
          type: string
          required: false
          description: One of weeks, quarters or years

  rovo:agent:
    - key: cascade-agent
      name: Cascade
      description: Reconstructs the decision paths that led to a failure and scores the alternatives
      icon: resource:main;icon.svg
      prompt: resource:agent;prompt.txt
      skills:
        - decision-autopsy
      actions:
        - reconstruct-decision
      conversationStarters:
        - Why did this build break?
        - What else could we have done in ADR-014?
        - Show me the paths we did not take

  rovo:skill:
    - key: decision-autopsy
      source:
        dir: skills/decision-autopsy
      dependencies:
        tools:
          - reconstruct-decision

  rovo:mcp:
    - key: cascade-mcp
      name: Cascade
      tools:
        - reconstruct-decision

  sql:
    - key: cascade-db

resources:
  - key: main
    path: static/panel/build
  - key: agent
    path: resource/agent

permissions:
  scopes:
    # Teamwork Graph (per-object, Preview). Every object type touched by a
    # traversal needs its own scope, including intermediate hops.
    - read:graph:issue:jira
    - read:graph:issue-comment:jira
    - read:graph:issue-status:jira
    - read:graph:issue-remote-link:jira
    - read:graph:project:jira
    - read:graph:page:confluence
    - read:graph:comment:confluence
    - read:graph:space:confluence
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - read:graph:goal:atlassian
    - read:graph:component:compass
    - read:graph:build:external
    - read:graph:deployment:external
    - read:graph:pull-request:external
    # Build-failure trigger
    - read:repository:bitbucket
    # Dossier write-back (the "write into the graph" path)
    - read:confluence-content.all
    - write:confluence-content
    # Demo seeding: the app creates the work item and ADR pages itself, so no
    # personal API token is ever needed to prepare a site.
    - write:jira-work
